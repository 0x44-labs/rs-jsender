[package]
name = "jsender"
version = "0.2.0"
description = """
Pure Rust implementation of the JSend specification for JSON response bodies.
"""
authors = ["Determination Labs Team"]
license = "MIT"
documentation = "https://docs.rs/jsender"
homepage = "https://github.com/0x44-labs/rs-jsender"
repository = "https://github.com/0x44-labs/rs-jsender"
keywords = ["jsend", "json", "http", "serde"]
categories = ["web-programming::http-server", "encoding"]
readme = "README.md"
edition = "2024"

[dependencies]
http = "1.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
